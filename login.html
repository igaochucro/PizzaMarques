<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Bella Massa</title>
  <link rel="stylesheet" href="css/xupador.css">
  <style>
    body{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--cream)}
    .login-card{width:min(420px,100%);background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:32px;box-shadow:0 18px 50px rgba(43,24,16,.12)}
    .login-logo{text-align:center;font-size:42px}.login-card h1{text-align:center;font-family:'Fraunces',serif;font-weight:500;margin:8px 0}.login-card p{text-align:center;color:var(--ink-soft);font-size:14px;margin-bottom:24px}
    label{display:block;font-size:13px;font-weight:600;margin:14px 0 7px}input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font:inherit;outline:none}input:focus{border-color:var(--ember)}
    #login-form .btn{width:100%;margin-top:20px}.error{display:none;margin-top:14px;padding:10px;border-radius:10px;background:#f8e3df;color:#8d2d20;font-size:13px}.hint{text-align:center;margin-top:18px;font-size:12px;color:var(--ink-soft)}
  </style>
</head>
<body>
  <main class="login-card">
    <div class="login-logo">🍕</div>
    <h1>Bella Massa</h1>
    <p>Acesso restrito à equipe</p>
    <form id="login-form">
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="username" required placeholder="funcionario@bellamassa.com">
      <label for="password">Senha</label>
      <input id="password" type="password" autocomplete="current-password" required placeholder="••••••••">
      <button class="btn btn-primary" type="submit">Entrar</button>
      <div id="login-error" class="error"></div>
    </form>
    <div class="hint">Somente funcionários autenticados podem acessar o caixa e a cozinha.</div>
  </main>

  <script type="module">
    import { onAuthStateChanged, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { auth, isFirebaseConfigured } from "./firebase-init.js";

    const form = document.getElementById("login-form");
    const error = document.getElementById("login-error");

    if (isFirebaseConfigured) {
      onAuthStateChanged(auth, (user) => {
        if (user) window.location.replace("GRAZY.html");
      });
    } else {
      error.textContent = "Configure o projeto Firebase em js/firebase-config.js antes de entrar.";
      error.style.display = "block";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      error.style.display = "none";
      if (!isFirebaseConfigured) {
        error.textContent = "Configure o projeto Firebase em js/firebase-config.js antes de entrar.";
        error.style.display = "block";
        return;
      }
      try {
        await signInWithEmailAndPassword(
          auth,
          document.getElementById("email").value.trim(),
          document.getElementById("password").value
        );
      } catch (err) {
        error.textContent = "E-mail ou senha inválidos. Verifique o cadastro no Firebase Authentication.";
        error.style.display = "block";
      }
    });
  </script>
</body>
</html>
